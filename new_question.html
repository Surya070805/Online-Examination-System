<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">New Question</h2>

            <form action="/new_question/{{Admin}}" method="post">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="chapter_id" class="form-label">Chapter ID</label>
                        <input type="text" class="form-control" id="chapter_id" name="chapter_id" placeholder="Enter Chapter ID" required>
                    </div>
                    <div class="col-md-4">
                        <label for="ques_id" class="form-label">Question ID</label>
                        <input type="text" class="form-control" id="ques_id" name="ques_id" placeholder="Enter Question ID" required>
                    </div>
                    <div class="col-md-4">
                        <label for="quiz_id" class="form-label">Quiz ID</label>
                        <input type="text" class="form-control" id="quiz_id" name="quiz_id" placeholder="Enter Quiz ID" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="title" class="form-label">Question Title</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="Enter question title" required>
                </div>

                <div class="mb-4">
                    <label for="statement" class="form-label">Question Statement</label>
                    <textarea class="form-control" id="statement" name="statement" rows="3" placeholder="Enter question statement" required></textarea>
                </div>

                <div class="card shadow p-4">
                    <h4 class="text-center mb-3">Single Option Correct</h4>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="opt1" class="form-label">Option 1</label>
                            <input type="text" class="form-control" id="opt1" name="opt1" placeholder="Enter option 1" required>
                        </div>
                        <div class="col-md-6">
                            <label for="opt2" class="form-label">Option 2</label>
                            <input type="text" class="form-control" id="opt2" name="opt2" placeholder="Enter option 2" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="opt3" class="form-label">Option 3</label>
                            <input type="text" class="form-control" id="opt3" name="opt3" placeholder="Enter option 3" required>
                        </div>
                        <div class="col-md-6">
                            <label for="opt4" class="form-label">Option 4</label>
                            <input type="text" class="form-control" id="opt4" name="opt4" placeholder="Enter option 4" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="correct_opt" class="form-label">Correct Option</label>
                        <input type="text" class="form-control" id="correct_opt" name="correct_opt" placeholder="Enter the correct option (1-4)" required>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary px-4">Submit</button>
                    <a href="/quiz_manag/{{Admin}}" class="btn btn-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
