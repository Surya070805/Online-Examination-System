<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Chapter | Quiz Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">Create New Chapter</h2>
            
            <form action="/new_chapter/{{Admin}}" method="POST">
                <div class="mb-3">
                    <label for="Input1" class="form-label">Chapter Name</label>
                    <input type="text" class="form-control" id="Input1" name="chap_name" placeholder="Enter Chapter Name" required>
                </div>

                <div class="mb-3">
                    <label for="Input4" class="form-label">Chapter ID</label>
                    <input type="text" class="form-control" id="Input4" name="chapter_id" placeholder="Enter Chapter ID" required>
                </div>

                <div class="mb-3">
                    <label for="Input5" class="form-label">Subject ID</label>
                    <input type="text" class="form-control" id="Input5" name="subj_id" placeholder="Enter Subject ID" required>
                </div>

                <div class="mb-3">
                    <label for="Input2" class="form-label">Description</label>
                    <textarea class="form-control" id="Input2" rows="3" name="descrip" placeholder="Enter Chapter Description" required></textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <a href="/admin_dash/{{Admin}}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
