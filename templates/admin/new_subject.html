<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New subject | Online Exams</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="bg-light">
<main class="container py-5" style="max-width:760px">
  <a class="small text-decoration-none" href="{{ url_for('admin_dash') }}">← Back to subjects</a>
  <section class="card mt-3"><div class="card-body p-4 p-md-5">
    <div class="exam-kicker">Administrator · {{ Admin }}</div><h1 class="h3 fw-bold mt-2">Create a subject</h1><p class="text-muted">Subject IDs are assigned automatically.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    <form action="{{ url_for('new_subject', Admin=Admin) }}" method="post">
      <div class="mb-3"><label class="form-label fw-bold" for="subj">Subject name</label><input class="form-control" id="subj" name="subj" maxlength="100" required></div>
      <div class="mb-4"><label class="form-label fw-bold" for="desc">Description</label><textarea class="form-control" id="desc" name="desc" rows="3" maxlength="1000"></textarea></div>
      <div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{{ url_for('admin_dash') }}">Cancel</a><button class="btn btn-primary" type="submit">Save subject</button></div>
    </form>
  </div></section>
</main>
</body>
</html>
