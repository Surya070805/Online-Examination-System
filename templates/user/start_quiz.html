<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Quiz | Quiz Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <script>
        let timeLeft = {{ quiz.time_duration }} * 60; 
        function startTimer() {
            const timerElement = document.getElementById("timer"); 
            setInterval(() => {
                if (timeLeft <= 0) {
                    document.getElementById("quiz-form").submit();
                    return;
                }
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                timerElement.innerText = minutes.toString().padStart(2, '0') + ":" + seconds.toString().padStart(2, '0');
                timeLeft--;
            }, 1000);
        }
    </script>

</head>
<body class="bg-light" onload="startTimer()">

    <div class="container_login">
        <div class="card_style">
            
          
            <div class="text-end">
                <span id="timer" class="badge bg-danger fs-5">{{ quiz.time_duration }}:00</span>
            </div>

            <h2 class="text-center text-primary mb-3">Start the Quiz</h2>

            {% set question_id_str = question.id|string %}
            {% set third_digit = question_id_str[2]|int if question_id_str|length > 2 else 0 %}

            <p class="fw-bold">Q.No: {{ third_digit }} / {{ total_questions }}</p>

            <form action="/start_quiz/{{ user_id }}/{{ usern }}/{{ quiz_id }}/{{ question.id }}" method="POST" id="quiz-form">
                
                <p class="fs-5"><strong>{{ question.question_statement }}</strong></p>

               
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="option" value="1" id="opt1" required>
                    <label class="form-check-label" for="opt1">a) {{ question.option1 }}</label>
                </div>

                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="option" value="2" id="opt2">
                    <label class="form-check-label" for="opt2">b) {{ question.option2 }}</label>
                </div>

                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="option" value="3" id="opt3">
                    <label class="form-check-label" for="opt3">c) {{ question.option3 }}</label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="option" value="4" id="opt4">
                    <label class="form-check-label" for="opt4">d) {{ question.option4 }}</label>
                </div>

                <div class="text-center">
                    <button type="submit" name="next" class="btn btn-primary">Save and Next</button>
                </div>

            </form>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
