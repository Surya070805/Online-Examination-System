<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Quiz | Quiz Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-body">
                <h2 class="text-center text-primary">View Quiz Details</h2>
                <hr>

                {% for subj in sub %}
                {% for chap in subj.chapters %}
                {% if chap.id == quiz.chapter_id %}
                
                <div class="mb-3">
                    <label class="fw-bold">Quiz ID:</label>
                    <input type="text" class="form-control" value="{{ quiz.id }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Subject:</label>
                    <input type="text" class="form-control" value="{{ subj.name }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Chapter:</label>
                    <input type="text" class="form-control" value="{{ chap.name }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Number of Questions:</label>
                    <input type="text" class="form-control" value="{{ quiz.questions|length }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Scheduled Date:</label>
                    <input type="text" class="form-control" value="{{ quiz.date_of_quiz }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Duration (hh:mm):</label>
                    <input type="text" class="form-control" value="{{ quiz.time_duration }}" readonly>
                </div>

                {% endif %}
                {% endfor %}
                {% endfor %}

                <div class="text-center mt-4">
                    <form action="/user_dash/{{usern}}/{{user_id}}" method="GET">
                        <button type="submit" class="btn btn-secondary">Close</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
