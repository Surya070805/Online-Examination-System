<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Quiz Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="bg-light">

    
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <p>Quiz Master</p>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/user_dash/{{ usern }}/{{user_id}}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/scores/{{usern}}/{{ user_id }}">Scores</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="/login">Logout</a></li>
                </ul>
                <form action="search/{{usern}}" method="GET" class="d-flex">
                    <input class="form-control me-2" type="text" name="query" placeholder="Search Users, Subjects, Quizzes..." required>
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
                <span class="text-white ms-3">Welcome, <strong>{{ usern }}</strong></span>
            </div>
        </div>
    </nav>

 
    <div class="container mt-4">
        <h2 class="text-center mb-4">Upcoming Quizzes</h2>

        <div class="card shadow p-4">
            <table class="table table-striped table-bordered">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>No. of Questions</th>
                        <th>Date</th>
                        <th>Duration (hh:mm)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for q in quizzes %}
                    <tr>
                        <td>{{ q.id }}</td>
                        <td>{{ q.questions|length }}</td>
                        <td>{{ q.date_of_quiz }}</td>
                        <td>{{ q.time_duration }}</td>
                        <td>
                            <a href="/view_quiz/{{usern}}/{{user_id}}/{{ q.id }}" class="btn btn-sm btn-primary">View</a>
                            <a href="/start_quiz/{{ user_id }}/{{usern}}/{{ q.id }}/{{ q.questions[0].id }}" class="btn btn-sm btn-success">Start</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
