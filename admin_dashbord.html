<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

<div class="container mt-4">
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow p-3 mb-4">
        <p>Admin Dashboard</p>
        <div class="collapse navbar-collapse justify-content-between">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/admin_dash/{{Admin}}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/quiz_manag/{{Admin}}">Quiz</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-danger" href="/login">Logout</a>
                </li>
            </ul>
            <form action="search/{{Admin}}" method="GET" class="d-flex">
                <input class="form-control me-2" type="text" name="query" placeholder="Search Users, Subjects, Quizzes..." required>
                <button class="btn btn-outline-primary" type="submit">Search</button>
            </form>
        </div>
    </nav>

    <h3 class="text-center mb-4">Welcome, {{Admin}}</h3>

    <div class="row">
        {% for subj in subjects %}
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h4 class="card-title text-primary">{{ subj.name }}</h4>

                    <table class="table table-bordered mt-3">
                        <thead class="table-light">
                            <tr>
                                <th>Chapter Name</th>
                                <th>No. of Questions</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for chap in subj.chapters %}
                            <tr>
                                <td>{{ chap.name }}</td>
                                <td>{{ chap.questions|length }}</td>
                                <td>
                                    <form action="/delete_chapter/{{Admin}}/{{chap.id}}" method="POST">
                                        <input type="hidden" name="chapter_id" value="{{ chap.id }}">
                                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>

                    <form action="/new_chapter/{{Admin}}" method="GET">
                        <button type="submit" class="btn btn-primary">+ Add Chapter</button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="text-center mt-4">
        <form action="/new_subject/{{Admin}}" method="GET">  
            <button class="btn btn-success px-4">+ Add Subject</button>
        </form>
    </div>

</div>

</body>
</html>
