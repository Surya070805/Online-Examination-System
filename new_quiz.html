<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Quiz | Quiz Master</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">Create New Quiz</h2>
            
            <form action="/new_quiz/{{Admin}}" method="POST">
                <div class="mb-3">
                    <label for="quizId" class="form-label">Quiz ID</label>
                    <input type="text" class="form-control" id="quizId" name="quiz_id" placeholder="Enter Quiz ID" required>
                </div>

                <div class="mb-3">
                    <label for="questionId" class="form-label">Question ID</label>
                    <input type="text" class="form-control" id="questionId" name="quest_id" placeholder="Enter Question ID" required>
                </div>

                <div class="mb-3">
                    <label for="chapterId" class="form-label">Chapter ID</label>
                    <input type="text" class="form-control" id="chapterId" name="chapter_id" placeholder="Enter Chapter ID" required>
                </div>

                <div class="mb-3">
                    <label for="quizDate" class="form-label">Date</label>
                    <input type="date" class="form-control" id="quizDate" name="date" required>
                </div>

                <div class="mb-3">
                    <label for="quizDuration" class="form-label">Duration (in minutes)</label>
                    <input type="number" class="form-control" id="quizDuration" name="duration" placeholder="Enter Duration" required>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <a href="/quiz_manag/{{Admin}}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
