<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examination result</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><section class="card mx-auto" style="max-width:36rem"><div class="card-body text-center"><h1 class="h3">Result</h1><p>{{ exam.remarks or ('Examination ' ~ exam.id) }}</p><p class="display-5">{{ attempt.score }} / {{ attempt.total_questions }}</p><p>Submitted: {{ attempt.submitted_at }}</p><a class="btn btn-primary" href="{{ url_for('student_exams') }}">Back to examinations</a></div></section></main></body></html>
