<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Quiz Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="bg-light">

 
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <p>Quiz Admin</p>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin_dash/{{Admin}}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/quiz_manag/{{Admin}}">Quiz</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Logout</a>
                    </li>
                </ul>
                <form action="search/{{Admin}}" method="GET" class="d-flex">
                    <input class="form-control me-2" type="text" name="query" placeholder="Search Users, Subjects, Quizzes..." required>
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

   
    <div class="container mt-4">
        <h2 class="text-center mb-4">Quiz Management</h2>
        
        <div class="row">
            {% for quiz in quizzes %}
            <div class="col-md-6 mb-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h4 class="card-title text-primary">Chapter: {{ quiz.chapter_id }}</h4>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold text-secondary">
                            <span>ID</span>
                            <span>Question</span>
                        </div>
                        {% for ques in quiz.questions %}
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <span>{{ ques.id }}</span>
                            <span class="text-truncate" style="max-width: 60%;">{{ ques.question_statement }}</span>
                        </div>
                        {% endfor %}
                        <div class="text-end mt-3">
                            <form action="/new_question/{{Admin}}" method="GET">
                                <button type="submit" class="btn btn-sm btn-primary">+ Add Question</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="text-center mt-4">
            <form action="/new_quiz/{{Admin}}" method="GET">
                <button class="btn btn-lg btn-success">+ Create New Quiz</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
